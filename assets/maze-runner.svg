  <rect x="128" y="258" width="49" height="82" rx="18" fill="#7B9BFF" opacity=".55"/>

  <!-- legs -->
  <path d="M211 404 L182 523 Q178 546 202 553 L227 553 Q238 543 230 527 L252 424Z" fill="url(#pants)"/>
  <path d="M279 420 L312 520 Q319 540 342 535 L359 527 Q367 515 354 503 L331 399Z" fill="url(#pants)"/>

