  <path d="M177 140 Q177 65 252 57 Q330 61 330 141 Q303 113 270 105 Q227 96 177 140Z" fill="#17212B"/>
  <path d="M185 135 Q213 100 256 105 Q300 109 323 139" fill="none" stroke="#3157D5" stroke-width="12"/>

  <!-- face -->
