  <!-- goggles -->
  <rect x="188" y="128" width="68" height="40" rx="17" fill="#17212B" opacity=".92"/>
  <rect x="250" y="128" width="68" height="40" rx="17" fill="#17212B" opacity=".92"/>
  <rect x="198" y="136" width="48" height="22" rx="9" fill="#9BE8CF"/>
  <rect x="260" y="136" width="48" height="22" rx="9" fill="#9BE8CF"/>
  <rect x="243" y="140" width="18" height="8" rx="4" fill="#17212B"/>

  <!-- chest badge -->
  <circle cx="286" cy="304" r="19" fill="#FFD45A"/>
  <path d="M278 305 L285 312 L297 296" fill="none" stroke="#17212B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

